<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Office Security Shield</title>
  <style>
    body {
      width: 220px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffffff;
      color: #333;
      padding: 15px;
      margin: 0;
      text-align: center;
    }
    h3 {
      color: #2c3e50;
      font-size: 15px;
      margin-bottom: 8px;
    }
    p {
      color: #666;
      font-size: 12px;
      line-height: 1.4;
      margin: 0;
    }
    .status {
      display: inline-block;
      background: #e8f8f5;
      color: #1abc9c;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h3>Office Security Shield</h3>
  <p>Secure browsing policy is active and monitoring requests.</p>
  <div class="status">● Protected</div>
</body>
</html>
