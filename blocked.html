<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Access Denied - Office Security</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 80px 20px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #e74c3c;
            margin-bottom: 10px;
            font-size: 26px;
        }

        p {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            background: #fadbd8;
            color: #c0392b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="badge">RESTRICTED ACCESS</div>
        <h1>Access Blocked</h1>
        <p>This website has been blocked by the IT Department in accordance with office security policies.</p>
    </div>
</body>

</html>
